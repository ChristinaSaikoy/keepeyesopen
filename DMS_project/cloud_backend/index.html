<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DMS Dashboard</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #101820; color: #edf2f7; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    header { border-bottom: 1px solid #40505e; padding-bottom: 16px; }
    h1 { margin: 0; font-size: 24px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    section { background: #17232e; border: 1px solid #40505e; border-radius: 6px; padding: 16px; }
    .value { font: 700 34px ui-monospace, monospace; }
    .label { color: #9eb0bf; font-size: 13px; }
    #advice { min-height: 52px; white-space: pre-wrap; }
    .danger { color: #ff8f8f; } .ok { color: #8ce0a7; } .waiting { color: #ffd27d; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Driver Monitoring System</h1>
      <div class="label" id="connection">Connecting to dashboard...</div>
    </header>
    <div class="grid">
      <section><div class="label">EAR (PC observation)</div><div class="value" id="ear">--</div></section>
      <section><div class="label">MAR (PC observation)</div><div class="value" id="mar">--</div></section>
      <section><div class="label">S3 fatigue level</div><div class="value" id="level">--</div></section>
      <section><div class="label">PERCLOS / link status</div><div class="value" id="perclos">--</div><div class="label" id="link">--</div></section>
    </div>
    <section style="margin-top:12px">
      <div class="label">AI advice (non-safety-critical)</div>
      <div id="advice">No advice received.</div>
    </section>
  </main>
  <script>
    const byId = (id) => document.getElementById(id);
    function number(value, digits = 2) { return Number.isFinite(value) ? value.toFixed(digits) : "--"; }
    function connect() {
      const socket = new WebSocket("ws://127.0.0.1:9001");
      socket.onopen = () => { byId("connection").textContent = "Dashboard connected"; byId("connection").className = "label ok"; };
      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        byId("ear").textContent = number(data.ear);
        byId("mar").textContent = number(data.mar);
        byId("level").textContent = Number.isInteger(data.level) ? data.level : "--";
        byId("level").className = "value " + (data.level >= 2 ? "danger" : "ok");
        byId("perclos").textContent = number(data.perclos, 3);
        byId("link").textContent = data.link_status || "waiting";
        byId("advice").textContent = data.ai_advice || "No advice received.";
      };
      socket.onclose = () => { byId("connection").textContent = "Dashboard disconnected; retrying"; byId("connection").className = "label waiting"; setTimeout(connect, 1000); };
    }
    connect();
  </script>
</body>
</html>
